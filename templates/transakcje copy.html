<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>TRANSAKCJE</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
    .table td, .table th { padding: 4px 8px; }
    </style>
</head>
<body class="bg-light">

    <div class="container text-center" style="margin-top: 30px;">
        <h1 class="fw-bold text-dark" style="letter-spacing: 4px; font-size: 2rem;">TRANSAKCJE</h1>
        <p class="lead text-secondary mb-3" style="font-size: 1rem;">HISTORIA TRANSAKCJI</p>
        {% include "nav.html" %}
    </div>

    <div class="container" style="margin-top: 40px;">
        <div style="max-height: 600px; overflow-y: auto;" class="mx-auto w-auto">
            <table class="table table-striped table-bordered bg-white w-auto mx-auto">
                <!-- <thead class="table-dark" style="position: sticky; top: 0;">
                    <tr>
                        <th>DATA</th>
                        <th>TYP</th>
                        <th>KATEGORIA</th>
                        <th>MIEJSCE</th>
                        <th>KWOTA</th>
                        <th>KONTO</th>
                    </tr>
                </thead> -->


<thead class="table-dark" style="position: sticky; top: 0;">
    <tr>
        <th>DATA</th>
        <th>TYP</th>
        <th>KATEGORIA</th>
        <th>MIEJSCE</th>
        <th>KWOTA</th>
        <th>KONTO</th>
    </tr>
    <tr class="bg-white">
        <th><input type="text" class="form-control form-control-sm filter-input" data-col="0" placeholder="szukaj..."></th>
        <th><input type="text" class="form-control form-control-sm filter-input" data-col="1" placeholder="szukaj..."></th>
        <th><input type="text" class="form-control form-control-sm filter-input" data-col="2" placeholder="szukaj..."></th>
        <th><input type="text" class="form-control form-control-sm filter-input" data-col="3" placeholder="szukaj..."></th>
        <th><input type="text" class="form-control form-control-sm filter-input" data-col="4" placeholder="szukaj..."></th>
        <th><input type="text" class="form-control form-control-sm filter-input" data-col="5" placeholder="szukaj..."></th>
    </tr>
</thead>


                <tbody>
                    {% for row in transakcje %}
                    <tr>
                        <td>{{ row["DATA"] }}</td>
                        <td>{{ row["TYP"] }}</td>
                        <td>{{ row["KATEGORIA"] }}</td>
                        <td>{{ row["MIEJSCE"] }}</td>
                        <td class="text-end">{{ "{:,.2f}".format(row["KWOTA"]) }} zł</td>
                        <td>{{ row["KONTO"] }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="6" class="text-center text-muted">No data yet.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>



    <script>
document.querySelectorAll('.filter-input').forEach(input => {
    input.addEventListener('input', () => {
        const table = input.closest('table');
        const filters = table.querySelectorAll('.filter-input');
        const rows = table.querySelectorAll('tbody tr');

        rows.forEach(row => {
            let visible = true;
            filters.forEach(f => {
                const col = f.dataset.col;
                const cell = row.children[col];
                if (!cell) return;
                if (f.value && !cell.textContent.toLowerCase().includes(f.value.toLowerCase())) {
                    visible = false;
                }
            });
            row.style.display = visible ? '' : 'none';
        });
    });
});
</script>


</body>
</html>
