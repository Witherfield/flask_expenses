<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Salda</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

    <div class="container" style="margin-top: 60px;">

        <h1 class="fw-bold text-dark mb-4">SALDA</h1>

        <table class="table table-striped table-bordered bg-white w-auto">
            <thead class="table-dark">
                <tr>
                    <th>ŹRÓDŁO</th>
                    <th>FAKTYCZNE</th>
                </tr>
            </thead>

            <tbody>
                {% for row in salda %}
                <tr>
                    <td class="fw">{{ row["TYP"] }}</td>
                    <td class="font-monospace text-end">{{ "{:,.2f}".format(row["KWOTA"]) }} zł</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center text-muted">No data yet.</td>
                </tr>
                {% endfor %}
                <tr class="fw-bold">
                    <td>TOTAL</td>
                    <td class="font-monospace text-end">{{ "{:,.2f}".format(salda|sum(attribute='KWOTA')) }} zł</td>
                </tr>
            </tbody>



        </table>

        <a href="/" class="btn btn-outline-secondary">POWRÓT</a>

    </div>

</body>
</html>
